<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>Buddy EP Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1220;
    color: #f8fafc;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
    max-width: 760px;
    margin: auto;
    padding: 18px 14px 40px;
}

h1 {
    font-size: 1.6rem;
    margin: 0;
}

h2 {
    font-size: 1rem;
    margin: 22px 0 10px;
}

.sub {
    color: #94a3b8;
    margin: 4px 0 18px;
    font-size: .9rem;
}

/* SCORE */

.score {
    background: #172554;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
}

#ep {
    font-size: 4.5rem;
    font-weight: 800;
    line-height: 1;
}

.outof {
    font-size: 1rem;
    color: #94a3b8;
    font-weight: 650;
    margin-top: 4px;
}

#status {
    color: #cbd5e1;
    font-size: .85rem;
    margin-top: 8px;
    min-height: 20px;
}

/* POSTPONE */

.postpone {
    width: 100%;
    background: #1e293b;
    border: 1px solid #60a5fa;
    border-radius: 16px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    margin-top: 12px;
}

/* BUTTONS */

button {
    font: inherit;
    color: inherit;
}

.activity {
    border: 1px solid #334155;
    background: #1e293b;
    border-radius: 16px;
    padding: 14px;
    min-height: 105px;
    text-align: left;
    cursor: pointer;
}

.activity:active,
.quick button:active,
.postpone:active {
    transform: scale(.98);
}

.activity.running {
    background: #1e3a5f;
    border-color: #60a5fa;
}

.activity:disabled {
    cursor: default;
}

.name {
    font-weight: 750;
}

.pts {
    float: right;
    color: #4ade80;
    font-weight: 800;
}

.time {
    font-size: 1.55rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin-top: 9px;
}

.hint {
    font-size: .74rem;
    color: #94a3b8;
    margin-top: 3px;
}

.count {
    font-size: .9rem;
    color: #cbd5e1;
    font-weight: 700;
    margin-top: 6px;
}

/* GRIDS */

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.quick {
    display: grid;
    gap: 9px;
}

.quick button {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
}

.quick button:disabled {
    opacity: .45;
    cursor: default;
}

/* BOTTOM CONTROLS */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
}

.controls button {
    padding: 11px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #111827;
    font-size: .82rem;
}

/* DESKTOP */

@media (min-width: 620px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<main>

<h1>Buddy EP Tracker</h1>

<div class="sub">
    Track your buddy's excitement points.
</div>


<!-- SCORE -->

<section class="score">

    <div id="ep">0</div>

    <div class="outof">
        out of 32 EP
    </div>

    <div id="status">
        No decay currently.
    </div>

    <button class="postpone" id="postpone">
        <span class="name">
            Postpone decay
        </span>

        <div class="hint">
            Repeat any action on cooldown
        </div>
    </button>

</section>


<!-- SWITCH BUDDY -->

<h2>Switch buddy</h2>

<div id="switch" class="quick"></div>


<!-- 30 MINUTE INTERACTIONS -->

<h2>
    30-minute interactions
</h2>

<div id="timers" class="grid"></div>


<!-- NON COOLDOWN -->

<h2>
    Non-cooldown interactions
</h2>

<div id="quick" class="quick"></div>


<!-- CONTROLS -->

<div class="controls">

    <button id="undo">
        Undo last gain
    </button>

    <button id="reset">
        Reset today
    </button>

</div>

</main>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const TIMER_MS = 30 * 60 * 1000;

// Invisible protection against accidental double taps.
const TAP_PROTECTION_MS = 60 * 1000;

// Decay begins after 25 minutes.
const DECAY_START = 25 * 60 * 1000;

// Once decay begins, lose 1 EP every 10 minutes.
const DECAY_EVERY = 10 * 60 * 1000;

const MAX_EP = 32;


/* =========================================================
   30-MINUTE INTERACTIONS
========================================================= */

const timers = [

    ["feed", "Feed Buddy", 2],

    ["play", "Play with buddy", 2],

    ["snapshot", "Snapshot", 2],

    ["teamleader", "Battle a team leader", 2],

    ["gbl", "Battle in the GBL", 2],

    ["raid", "Battle in a raid", 2],

    ["maxspot", "Battle at a max spot", 2],

    ["gym", "Battle in a gym", 2],

    ["grunt", "Battle a rocket grunt", 2],

    ["rocketleader", "Battle a rocket leader", 2],

    ["giovanni", "Battle Giovanni", 2],

    ["newstop", "Spin a new Pokestop", 3]

];


/* =========================================================
   NON-COOLDOWN INTERACTIONS
========================================================= */

const quick = [

    ["present", "Open a Present", 4, "present"],

    ["route", "Do a Route", 3, "tapProtection"],

    ["walk", "Walk 2 km", 4, "tapProtection"],

    ["misc", "Miscellaneous Hearts", 1, "misc"]

];


/* =========================================================
   DAILY STORAGE
========================================================= */

function getDay() {

    return new Date().toLocaleDateString("en-CA");

}


function freshState() {

    return {

        day: getDay(),

        ep: 0,

        lastGain: null,

        timers: {},

        tapProtection: {},

        switchUsed: false,

        presents: 0,

        counts: {

            route: 0,

            walk: 0,

            misc: 0

        },

        history: []

    };

}


function loadState() {

    try {

        const stored =
            JSON.parse(
                localStorage.getItem("buddyEPTracker")
            );

        if (!stored || stored.day !== getDay()) {

            return freshState();

        }

        return {

            ...freshState(),

            ...stored

        };

    }

    catch (error) {

        return freshState();

    }

}


let state = loadState();


function save() {

    localStorage.setItem(

        "buddyEPTracker",

        JSON.stringify(state)

    );

}


/* =========================================================
   DECAY
========================================================= */

function processDecay() {

    if (
        !state.lastGain ||
        state.ep <= 0
    ) {

        return;

    }

    const elapsed =
        Date.now() - state.lastGain;


    if (elapsed < DECAY_START) {

        return;

    }


    const losses =
        Math.floor(
            (elapsed - DECAY_START)
            / DECAY_EVERY
        ) + 1;


    const actualLoss =
        Math.min(
            losses,
            state.ep
        );


    state.ep -= actualLoss;


    state.lastGain +=
        actualLoss * DECAY_EVERY;


    save();

}


/* =========================================================
   ADD EP
========================================================= */

function gainEP(points, label) {

    processDecay();


    const previous =
        state.ep;


    state.ep =
        Math.min(
            MAX_EP,
            state.ep + points
        );


    const actualGain =
        state.ep - previous;


    if (actualGain <= 0) {

        return;

    }


    state.lastGain =
        Date.now();


    state.history.push({

        points: actualGain,

        label: label,

        time: state.lastGain

    });


    if (state.history.length > 50) {

        state.history.shift();

    }


    save();

    render();

}


/* =========================================================
   POSTPONE DECAY
========================================================= */

function postponeDecay() {

    processDecay();


    if (state.ep <= 0) {

        return;

    }


    // Reset the decay countdown without
    // awarding additional EP.

    state.lastGain =
        Date.now();


    save();

    render();

}


/* =========================================================
   TIME FORMATTING
========================================================= */

function formatTime(milliseconds) {

    const totalSeconds =
        Math.max(
            0,
            Math.ceil(
                milliseconds / 1000
            )
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    return (
        minutes +
        ":" +
        String(seconds).padStart(2, "0")
    );

}


/* =========================================================
   START 30-MINUTE TIMER
========================================================= */

function startTimer(
    id,
    name,
    points
) {

    if (
        state.timers[id] &&
        state.timers[id] > Date.now()
    ) {

        return;

    }


    state.timers[id] =
        Date.now() + TIMER_MS;


    gainEP(
        points,
        name
    );

}


/* =========================================================
   QUICK INTERACTIONS
========================================================= */

function useQuick(
    id,
    name,
    points,
    type
) {

    processDecay();


    /* Present limit */

    if (
        type === "present" &&
        state.presents >= 2
    ) {

        return;

    }


    /* Invisible 60-second protection
       for Route and Walk */

    if (
        type === "tapProtection" &&
        state.tapProtection[id] &&
        state.tapProtection[id] > Date.now()
    ) {

        return;

    }


    if (type === "present") {

        state.presents++;

    }


    if (type === "tapProtection") {

        state.tapProtection[id] =
            Date.now() +
            TAP_PROTECTION_MS;


        state.counts[id]++;

    }


    if (type === "misc") {

        state.counts.misc++;

    }


    gainEP(
        points,
        name
    );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    processDecay();


    /* SCORE */

    document.getElementById("ep")
        .textContent =
        state.ep;


    const status =
        document.getElementById("status");


    if (
        state.ep >= MAX_EP
    ) {

        status.textContent =
            "Your buddy is now excited!";

    }

    else if (
        !state.lastGain ||
        state.ep <= 0
    ) {

        status.textContent =
            "No decay currently.";

    }

    else {

        const elapsed =
            Date.now() -
            state.lastGain;


        if (
            elapsed < DECAY_START
        ) {

            status.textContent =
                "Decay starts in " +
                formatTime(
                    DECAY_START -
                    elapsed
                ) +
                ".";

        }

        else {

            const untilNext =
                DECAY_EVERY -
                (
                    (elapsed - DECAY_START)
                    % DECAY_EVERY
                );


            status.textContent =
                "Decay active • next −1 EP in " +
                formatTime(untilNext) +
                ".";

        }

    }


    /* =====================================================
       SWITCH BUDDY
    ===================================================== */

    const switchBox =
        document.getElementById("switch");


    switchBox.innerHTML = "";


    const switchButton =
        document.createElement("button");


    switchButton.disabled =
        state.switchUsed;


    switchButton.innerHTML =

        '<span class="name">' +
        'Switch to your buddy' +
        '</span>' +

        '<span class="pts">' +
        '+2 EP' +
        '</span>' +

        '<div class="hint">' +

        (
            state.switchUsed
            ? "Already used today"
            : "Only possible once"
        ) +

        '</div>';


    switchButton.onclick =
        function () {

            if (
                state.switchUsed
            ) {

                return;

            }


            state.switchUsed =
                true;


            gainEP(
                2,
                "Switch to your buddy"
            );

        };


    switchBox.appendChild(
        switchButton
    );


    /* =====================================================
       30-MINUTE TIMERS
    ===================================================== */

    const timerBox =
        document.getElementById("timers");


    timerBox.innerHTML = "";


    // Active cooldowns move to the top.
    const orderedTimers =
        [...timers].sort(
            function (a, b) {

                const aActive =
                    (state.timers[a[0]] || 0)
                    > Date.now();


                const bActive =
                    (state.timers[b[0]] || 0)
                    > Date.now();


                return (
                    Number(bActive) -
                    Number(aActive)
                );

            }
        );


    orderedTimers.forEach(
        function ([id, name, points]) {

            const remaining =
                (
                    state.timers[id] ||
                    0
                ) - Date.now();


            const active =
                remaining > 0;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "activity" +
                (
                    active
                    ? " running"
                    : ""
                );


            button.disabled =
                active;


            button.innerHTML =

                '<span class="name">' +
                name +
                '</span>' +

                '<span class="pts">' +
                '+' +
                points +
                ' EP' +
                '</span>' +

                '<div class="time">' +
                (
                    active
                    ? formatTime(remaining)
                    : "START"
                ) +
                '</div>' +

                '<div class="hint">' +
                (
                    active
                    ? "Cooldown running"
                    : "Tap to start 30-minute timer"
                ) +
                '</div>';


            button.onclick =
                function () {

                    startTimer(
                        id,
                        name,
                        points
                    );

                };


            timerBox.appendChild(
                button
            );

        }
    );


    /* =====================================================
       NON-COOLDOWN INTERACTIONS
    ===================================================== */

    const quickBox =
        document.getElementById("quick");


    quickBox.innerHTML = "";


    quick.forEach(
        function ([id, name, points, type]) {

            let disabled =
                false;


            let hint =
                "No cooldown";


            let countText =
                "";


            /* PRESENT */

            if (
                type === "present"
            ) {

                disabled =
                    state.presents >= 2;


                hint =
                    state.presents +
                    "/2 presents opened today";

            }


            /* ROUTE / WALK */

            if (
                type === "tapProtection"
            ) {

                const remaining =
                    (
                        state.tapProtection[id] ||
                        0
                    ) - Date.now();


                disabled =
                    remaining > 0;


                // Deliberately say "No cooldown"
                // even while the invisible
                // double-tap protection is active.

                hint =
                    "No cooldown";


                countText =
                    state.counts[id] +
                    " completed";

            }


            /* MISCELLANEOUS */

            if (
                type === "misc"
            ) {

                hint =
                    "Tracking sleep • " +
                    "Spinning interesting PokéStops • " +
                    "Cooldown unknown";


                countText =
                    state.counts.misc +
                    " earned";

            }


            const button =
                document.createElement(
                    "button"
                );


            button.disabled =
                disabled;


            button.innerHTML =

                '<span class="name">' +
                name +
                '</span>' +

                '<span class="pts">' +
                '+' +
                points +
                ' EP' +
                '</span>' +

                (
                    countText
                    ? '<div class="count">' +
                      countText +
                      '</div>'
                    : ''
                ) +

                '<div class="hint">' +
                hint +
                '</div>';


            button.onclick =
                function () {

                    useQuick(
                        id,
                        name,
                        points,
                        type
                    );

                };


            quickBox.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

document
    .getElementById("postpone")
    .onclick =
    postponeDecay;


document
    .getElementById("undo")
    .onclick =
    function () {

        const last =
            state.history.pop();


        if (!last) {

            return;

        }


        state.ep =
            Math.max(
                0,
                state.ep - last.points
            );


        const previous =
            [...state.history]
            .reverse()
            .find(
                function (item) {

                    return item.points > 0;

                }
            );


        state.lastGain =
            previous
            ? previous.time
            : null;


        save();

        render();

    };


document
    .getElementById("reset")
    .onclick =
    function () {

        if (
            confirm(
                "Reset today's EP, timers and daily limits?"
            )
        ) {

            state =
                freshState();


            save();

            render();

        }

    };


/* =========================================================
   UPDATE EVERY SECOND
========================================================= */

setInterval(
    render,
    1000
);


render();

</script>


<script>

if (
    "serviceWorker" in navigator
) {

    navigator.serviceWorker
        .register("./sw.js")
        .catch(
            function () {}
        );

}

</script>

</body>
</html>
